# 拾光小站 · Nginx 反向代理配置
#
# 放到 /etc/nginx/sites-available/shiguang，然后：
#   sudo ln -sf /etc/nginx/sites-available/shiguang /etc/nginx/sites-enabled/shiguang
#   sudo rm -f /etc/nginx/sites-enabled/default      # 关掉默认欢迎页
#   sudo nginx -t && sudo systemctl reload nginx
#
# 效果：访问 http://你的服务器IP/ 就是你的博客，不用再带 :8080

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 换成你的域名；只用 IP 访问时写 _ 即可（已在上面声明 default_server）
    server_name _;

    # 非常重要：必须 >= 应用的 spring.servlet.multipart.max-request-size（60MB），
    # 否则上传歌曲会被 Nginx 先拦掉，报 413 Request Entity Too Large
    client_max_body_size 60m;

    # 访问日志，排查问题用
    access_log /var/log/nginx/shiguang.access.log;
    error_log  /var/log/nginx/shiguang.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大音频时别中途超时断开
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # 允许流式转发大文件，避免 Nginx 先缓冲到磁盘
        proxy_request_buffering off;
    }
}
