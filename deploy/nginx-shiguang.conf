# 拾光小站 · Nginx 反向代理配置
#
# 放到 /etc/nginx/sites-available/shiguang，然后：
#   sudo ln -sf /etc/nginx/sites-available/shiguang /etc/nginx/sites-enabled/shiguang
#   sudo rm -f /etc/nginx/sites-enabled/default      # 关掉默认欢迎页
#   sudo nginx -t && sudo systemctl reload nginx
#
# 效果：访问 http://你的域名或服务器IP/ 就是你的博客，不用再带 :8080
#
# 配好 HTTPS 后，certbot --nginx 会自动往这个文件里插入 443 的 server 块，
# 并在下面这个 80 块里加上 301 跳转。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 换成你的域名；只用 IP 访问时写 _ 即可（上面已声明 default_server）
    server_name _;

    # 非常重要：必须 >= 应用的 spring.servlet.multipart.max-request-size（60MB），
    # 否则上传歌曲会被 Nginx 先拦掉，报 413 Request Entity Too Large
    client_max_body_size 60m;

    # 访问日志，排查问题用
    access_log /var/log/nginx/shiguang.access.log;
    error_log  /var/log/nginx/shiguang.error.log;

    # ---------------- 安全响应头 ----------------
    # X-Frame-Options + frame-ancestors：禁止别的站点把本站嵌进 iframe。
    #   后台有「删文章 / 禁言」这类破坏性按钮，不加就可能被点击劫持。
    add_header X-Frame-Options        "SAMEORIGIN" always;
    # 禁止浏览器猜内容类型（上传目录与主站同源，防老浏览器的类型嗅探）
    add_header X-Content-Type-Options "nosniff" always;
    # 跨站跳转时不要泄露完整地址
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # CSP：脚本只允许同源（前端没有任何内联 script，也没有 eval）；
    # 样式保留 'unsafe-inline'，因为页面里有不少 style="..." 内联样式。
    # img-src 只放 'self' 和 data:（favicon 是内联 SVG）；
    # 若以后把背景图/图标设成站外 https 地址，需要在这里把 https: 加回去。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大音频时别中途超时断开
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # 允许流式转发大文件，避免 Nginx 先缓冲到磁盘
        proxy_request_buffering off;
    }
}
