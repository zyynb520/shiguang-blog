# ============================================================
#  生产环境配置（服务器上用它）
#
#  激活方式：环境变量 SPRING_PROFILES_ACTIVE=prod
#  这个文件里【不放任何密码】—— 数据库账号密码一律由
#  环境变量 DB_USERNAME / DB_PASSWORD 注入，见 deploy/DEPLOY.md
# ============================================================

# 出错时不要把异常信息和堆栈返回给浏览器
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never

# 关闭公开注册。
# 注意：库里一个用户都没有时仍然可以注册，所以首次部署能正常创建管理员账号，
# 创建完之后这个注册入口就自动对外关闭了。
# —— 上面这条是单用户时期的规则。现在已经改成多用户：注册默认开放，
#    靠 app.max-users（默认 10）限制总人数。想临时关闭注册，
#    在 .env 里加 REGISTRATION_ENABLED=false 再重启即可。

# 只监听本机回环地址。
# 线上是 nginx 反代到 127.0.0.1:8080 的，应用不需要对外暴露 8080：
# 这样即使云安全组或 ufw 误放行了 8080，外面也连不上（根本没有进程监听公网地址）。
# 万一 nginx 出问题需要临时从外网直连排查，在 .env 里加 SERVER_ADDRESS=0.0.0.0 再重启即可。
server.address=${SERVER_ADDRESS:127.0.0.1}

# 减少启动噪音；日志直接进 systemd 的 journald
# 查看日志：journalctl -u shiguang-blog -f
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.com.example.hello_spring=INFO
