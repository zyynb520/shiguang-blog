# ============================================================
#  公共配置（会被打进 jar，所以这里绝对不能写密码）
# ============================================================

# 服务器端口（可用环境变量 PORT 覆盖，例如想直接跑在 80 端口）
server.port=${PORT:8080}

# 默认激活 local profile，方便本地开发：
# 本地数据库账号密码放在【项目根目录】的 application-local.properties，
# 该文件不在 src/main/resources 下，不会被打进 jar，且已被 .gitignore 忽略。
# 服务器上改成 SPRING_PROFILES_ACTIVE=prod，账号密码由环境变量注入。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 数据库连接：账号密码一律由环境变量注入，这里默认值留空
# allowPublicKeyRetrieval=true 是必须的：MySQL 8 默认用 caching_sha2_password，
# MySQL 重启后认证缓存失效，客户端需要取服务端 RSA 公钥才能登录，
# 不加这个参数会报 "Public Key Retrieval is not allowed" 而连不上。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# 上传文件保存目录（相对当前工作目录，也可填绝对路径）
# 服务器上建议用绝对路径，例如 /opt/shiguang/uploads
app.upload-dir=${UPLOAD_DIR:uploads}

# 上传大小限制：音频文件通常较大，默认 1MB 不够用
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# ---------------- 静态资源缓存 ----------------
# 让浏览器每次都用 If-Modified-Since 回源校验（没变就 304，很便宜）。
#
# 不设这个的话，Spring 只发 Last-Modified、没有 Cache-Control，
# 浏览器会按「启发式缓存」自己估一个有效期 —— 对几天前抓到的旧 JS
# 可能直接不校验地继续用，改完前端用户还是看到旧页面。
# 而且 http:// 与 https:// 是两个独立 origin、缓存互不相干，
# 就会出现「同一个站点两个协议下界面不一样」这种怪现象。
# 上传目录（/uploads/**）在 WebConfig 里单独设了 30 天长缓存（文件名是哈希）。
spring.web.resources.cache.cachecontrol.no-cache=true

# ---------------- 登录 ----------------
# 是否受理登录请求。
# 现在登录接口本身已经只允许站长账号（见 UserController 的角色校验），
# 这个开关额外决定「页面上要不要露出登录入口、以及是否受理登录」。
# 备案审核期间保持 false 更稳妥：整站对外只读，站长靠下面的 IP 白名单进来。
app.login-enabled=${LOGIN_ENABLED:true}

# 允许登录的 IP 白名单（逗号分隔，留空表示不限制）。
# 白名单内的 IP 始终可以登录，不受上面 login-enabled 影响 ——
# 备案审核期间保持只读、又需要自己发文时，把自己的 IP 填在这里即可。
# 取客户端 IP 的方式与浏览量去重一致（优先 X-Real-IP）。
app.login-allowed-ips=${LOGIN_ALLOWED_IPS:}

# 是否强制登录走 HTTPS。
# 默认关，所以本地直接跑 localhost:8080 不受影响；
# 服务器上设成 true 之后，明文 HTTP 下提交密码会被直接拒绝，
# 避免管理员密码在公共 WiFi 这类链路上被嗅探。
# 前置条件：nginx 必须转发 X-Forwarded-Proto（deploy/nginx-shiguang.conf 里已有）。
app.require-https-login=${REQUIRE_HTTPS_LOGIN:false}

# ---------------- 配额 ----------------
# 每个用户最多发布多少篇文章
app.max-articles-per-user=${MAX_ARTICLES_PER_USER:10}
# 每个用户最多上传多少首歌
app.max-songs-per-user=${MAX_SONGS_PER_USER:10}

# 前端静态资源位置。
# 默认直接用 jar 包里的 static 目录；想在服务器上直接改前端（改个颜色/文案）
# 而不用重新打包传 24MB，就设成 External 目录在前、jar 内兜底：
#   STATIC_LOCATIONS=file:/opt/shiguang/static/,classpath:/static/
# 这样 /opt/shiguang/static/ 里存在的文件优先，其余仍用 jar 里的。
spring.web.resources.static-locations=${STATIC_LOCATIONS:classpath:/static/}
