<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾光小站</title>
  <meta name="description" content="记录代码、音乐与日常的个人小站">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238b5cf6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230a0a1a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <!-- head 里的是全局脚本，软导航换页时不会重复加载 -->
  <script src="/js/site.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <!-- 全站播放器：同步执行，切页时能最早恢复播放 -->
  <script src="/js/globalplayer.js"></script>
  <!-- 站内软导航：不整页刷新，音乐才能真正不中断 -->
  <script src="/js/router.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-dot"></span>
      <span data-site-name>拾光小站</span>
    </a>
    <nav class="nav">
      <a href="/" class="active">首页</a>
      <a href="/songs.html">曲库</a>
      <span id="nav-user"></span>
    </nav>
  </div>
</header>

<main>
  <section class="hero wrap">
    <h1 data-site-name>拾光小站</h1>
    <p data-site-subtitle></p>
    <div class="chips">
      <span class="chip">文章 <b id="stat-articles">–</b></span>
      <span class="chip">曲库 <b id="stat-songs">–</b></span>
    </div>
  </section>

  <div class="wrap layout">

    <!-- 每日推歌 -->
    <aside class="sidebar">
      <div class="song-card">
        <h2 class="section-title">每日推歌 <span class="count" id="song-date"></span></h2>
        <div id="song-body">
          <div class="vinyl-wrap"><div class="vinyl skeleton" style="border-radius:50%"></div></div>
          <div class="song-info">
            <div class="skeleton" style="height:16px;width:70%;margin:0 auto 10px"></div>
            <div class="skeleton" style="height:13px;width:45%;margin:0 auto"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 文章列表 -->
    <section class="articles">
      <h2 class="section-title">最新文章 <span class="count" id="article-count"></span></h2>
      <div class="article-list" id="article-list">
        <div class="skeleton" style="height:118px;border-radius:22px"></div>
        <div class="skeleton" style="height:118px;border-radius:22px"></div>
      </div>
    </section>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span data-site-name>拾光小站</span> · 用 <span class="heart">♥</span> 与 Spring Boot 搭建
    <br>
    <!-- 工信部要求：ICP 备案号必须展示，并链接到 beian.miit.gov.cn。
         备案号变化时改这一行（index / post / songs / admin 四个页面都要改） -->
    <a class="icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">桂ICP备2026025603号</a>
  </div>
</footer>

<div class="toast-host"></div>

<!-- 页面脚本：软导航换页时会重新加载执行 -->
<script src="/js/index.js"></script>
</body>
</html>
