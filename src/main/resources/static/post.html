<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 · 拾光小站</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238b5cf6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230a0a1a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <!-- head 里的是全局脚本，软导航换页时不会重复加载 -->
  <script src="/js/site.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/markdown.js"></script>
  <!-- 全站播放器：同步执行，切页时能最早恢复播放 -->
  <script src="/js/globalplayer.js"></script>
  <!-- 站内软导航：不整页刷新，音乐才能真正不中断 -->
  <script src="/js/router.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-dot"></span>
      <span data-site-name>拾光小站</span>
    </a>
    <nav class="nav">
      <a href="/">首页</a>
      <a href="/songs.html">曲库</a>
      <span id="nav-user"></span>
    </nav>
  </div>
</header>

<main class="wrap post-page">
  <a class="back-link" href="/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    返回首页
  </a>

  <article class="post" id="post">
    <h1 class="skeleton" style="height:38px;width:62%"></h1>
    <div class="skeleton" style="height:16px;width:34%;margin-bottom:24px"></div>
    <div class="skeleton" style="height:15px;margin-bottom:12px"></div>
    <div class="skeleton" style="height:15px;margin-bottom:12px"></div>
    <div class="skeleton" style="height:15px;width:72%"></div>
  </article>

</main>

<footer class="site-footer">
  <div class="wrap">
    <span data-site-name>拾光小站</span> · 用 <span class="heart">♥</span> 与 Spring Boot 搭建
    <br>
    <!-- 工信部要求：ICP 备案号必须展示，并链接到 beian.miit.gov.cn。
         备案号变化时改这一行（index / post / songs / admin 四个页面都要改） -->
    <a class="icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">桂ICP备2026025603号</a>
  </div>
</footer>

<div class="toast-host"></div>

<!-- 页面脚本：软导航换页时会重新加载执行 -->
<script src="/js/post.js"></script>
</body>
</html>
